<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Batería</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; padding: 30px; }
        h2 { color: #0064b4; margin-bottom: 20px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; width: 250px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-buscar { background: #0064b4; color: white; }
        .btn-eliminar { background: #b40000; color: white; }
        .btn-volver { background: #1e1e1e; color: white; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        th { background: #0064b4; color: white; padding: 10px; text-align: left; font-size: 13px; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        .mensaje { margin-top: 15px; padding: 10px; border-radius: 4px; font-size: 13px; }
        .exito { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>🗑️ Eliminar Batería</h2>
    <div class="search-bar">
        <input id="txtId" type="text" placeholder="Ingrese el ID de la batería">
        <button class="btn btn-buscar" onclick="buscar()">Buscar</button>
        <button class="btn btn-volver" onclick="location.href='index.html'">← Volver</button>
    </div>
    <div id="resultado"></div>
    <div id="btnEliminar" style="display:none" class="btn-group">
        <button class="btn btn-eliminar" onclick="eliminar()">🗑️ Confirmar Eliminación</button>
    </div>
    <div id="mensaje"></div>

    <script>
        const axios = require('axios')
        const BASE_URL = 'http://localhost:8080'
        let idActual = ''

        async function buscar() {
            const id = document.getElementById('txtId').value.trim()
            if (!id) { alert('Ingrese un ID.'); return }
            try {
                const res = await axios.get(`${BASE_URL}/baterias/${id}`)
                const b = res.data
                idActual = id
                document.getElementById('resultado').innerHTML = `
                    <table>
                        <tr><th>ID</th><th>Marca</th><th>Capacidad (kWh)</th><th>Ciclos de vida</th><th>Voltaje (V)</th></tr>
                        <tr>
                            <td>${b.idBateria}</td>
                            <td>${b.marca}</td>
                            <td>${b.capacidadKwh}</td>
                            <td>${b.ciclosVida}</td>
                            <td>${b.voltaje}</td>
                        </tr>
                    </table>`
                document.getElementById('btnEliminar').style.display = 'flex'
            } catch (e) {
                document.getElementById('resultado').innerHTML = ''
                document.getElementById('btnEliminar').style.display = 'none'
                document.getElementById('mensaje').innerHTML =
                    `<div class="mensaje error">No se encontró ninguna batería con ID: ${id}</div>`
            }
        }

        async function eliminar() {
            if (!idActual) { alert('Busque primero una batería.'); return }
            if (!confirm('¿Confirma la eliminación?')) return
            try {
                await axios.delete(`${BASE_URL}/baterias/${idActual}`)
                document.getElementById('resultado').innerHTML = ''
                document.getElementById('btnEliminar').style.display = 'none'
                document.getElementById('txtId').value = ''
                idActual = ''
                document.getElementById('mensaje').innerHTML =
                    `<div class="mensaje exito">Eliminada correctamente.</div>`
            } catch (e) {
                document.getElementById('mensaje').innerHTML =
                    `<div class="mensaje error">Error al eliminar.</div>`
            }
        }
    </script>
</body>
</html>
