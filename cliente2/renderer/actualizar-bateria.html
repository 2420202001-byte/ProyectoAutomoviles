<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Batería</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; padding: 30px; }
        h2 { color: #0064b4; margin-bottom: 20px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; color: #555; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-right: 8px; }
        .btn-buscar { background: #0064b4; color: white; }
        .btn-actualizar { background: #2e8b57; color: white; }
        .btn-volver { background: #1e1e1e; color: white; }
        #panelForm { display: none; margin-top: 20px; }
        .mensaje { margin-top: 15px; padding: 10px; border-radius: 4px; font-size: 13px; }
        .exito { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <h2>✏️ Actualizar Batería</h2>
    <div class="search-bar">
        <input id="txtIdBuscar" type="text" placeholder="Paso 1 - Ingrese el ID">
        <button class="btn btn-buscar" onclick="buscar()">Buscar</button>
        <button class="btn btn-volver" onclick="location.href='index.html'">← Volver</button>
    </div>

    <div id="panelForm">
        <div class="form-group"><label>ID:</label><input id="id" type="text"></div>
        <div class="form-group"><label>Marca:</label><input id="marca" type="text"></div>
        <div class="form-group"><label>Capacidad (kWh):</label><input id="capacidadKwh" type="number"></div>
        <div class="form-group"><label>Ciclos de vida:</label><input id="ciclosVida" type="number"></div>
        <div class="form-group"><label>Voltaje (V):</label><input id="voltaje" type="number"></div>
        <div class="btn-group">
            <button class="btn btn-actualizar" onclick="actualizar()">✏️ Actualizar</button>
            <button class="btn btn-volver" onclick="location.href='index.html'">← Volver</button>
        </div>
    </div>
    <div id="mensaje"></div>

    <script>
        const axios = require('axios')
        const BASE_URL = 'http://localhost:8080'
        let idOriginal = ''

        async function buscar() {
            const id = document.getElementById('txtIdBuscar').value.trim()
            if (!id) { alert('Ingrese un ID.'); return }
            try {
                const res = await axios.get(`${BASE_URL}/baterias/${id}`)
                const b = res.data
                idOriginal = id
                document.getElementById('id').value = b.idBateria
                document.getElementById('marca').value = b.marca
                document.getElementById('capacidadKwh').value = b.capacidadKwh
                document.getElementById('ciclosVida').value = b.ciclosVida
                document.getElementById('voltaje').value = b.voltaje
                document.getElementById('panelForm').style.display = 'block'
            } catch (e) {
                document.getElementById('mensaje').innerHTML =
                    `<div class="mensaje error">No se encontró ninguna batería con ID: ${id}</div>`
            }
        }

        async function actualizar() {
            try {
                const bateria = {
                    idBateria: document.getElementById('id').value.trim(),
                    marca: document.getElementById('marca').value.trim(),
                    capacidadKwh: parseFloat(document.getElementById('capacidadKwh').value),
                    ciclosVida: parseInt(document.getElementById('ciclosVida').value),
                    voltaje: parseFloat(document.getElementById('voltaje').value)
                }
                await axios.put(`${BASE_URL}/baterias/${idOriginal}`, bateria)
                document.getElementById('mensaje').innerHTML =
                    `<div class="mensaje exito">Batería actualizada correctamente.</div>`
                document.getElementById('panelForm').style.display = 'none'
            } catch (e) {
                document.getElementById('mensaje').innerHTML =
                    `<div class="mensaje error">Error al actualizar.</div>`
            }
        }
    </script>
</body>
</html>
