<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Mantenimiento</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; padding: 30px; }
        h2 { color: #7c3aed; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; color: #555; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 10px; }
        .btn-guardar { background: #7c3aed; color: white; }
        .btn-limpiar { background: #888; color: white; }
        .btn-volver { background: #1e1e1e; color: white; }
        .mensaje { margin-top: 15px; padding: 10px; border-radius: 4px; font-size: 13px; }
        .exito { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>🔧 Adicionar Mantenimiento</h2>
    <div class="form-group"><label>ID Mantenimiento:</label><input id="idMantenimiento" type="text"></div>
    <div class="form-group"><label>Tipo:</label><input id="tipo" type="text"></div>
    <div class="form-group"><label>Descripción:</label><input id="descripcion" type="text"></div>
    <div class="form-group"><label>Costo ($):</label><input id="costo" type="number" step="0.01"></div>
    <div class="form-group"><label>Kilometraje:</label><input id="kilometraje" type="number"></div>
    <div class="form-group"><label>Fecha de mantenimiento:</label><input id="fechaMantenimiento" type="datetime-local"></div>
    <div class="form-group">
        <label>Automóvil a gasolina:</label>
        <select id="idAuto"></select>
    </div>
    <button class="btn btn-guardar" onclick="guardar()">Guardar</button>
    <button class="btn btn-limpiar" onclick="limpiar()">Limpiar</button>
    <button class="btn btn-volver" onclick="location.href='index.html'">← Volver</button>
    <div id="mensaje"></div>

    <script>
        const axios = require('axios')
        const BASE_URL = 'http://localhost:8080'

        function pad(n) { return String(n).padStart(2, '0') }

        function setFechaActual() {
            const d = new Date()
            const local = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`
            document.getElementById('fechaMantenimiento').value = local
        }

        async function cargarAutos() {
            try {
                const res = await axios.get(`${BASE_URL}/gasolina/`)
                const select = document.getElementById('idAuto')
                select.innerHTML = '<option value="">-- Seleccione un automóvil --</option>'
                res.data.forEach(a => {
                    const option = document.createElement('option')
                    option.value = a.id
                    option.textContent = `${a.id} - ${a.marca} ${a.modelo}`
                    select.appendChild(option)
                })
            } catch (e) {
                mostrarMensaje('No se pudieron cargar los automóviles: ' + e.message, 'error')
            }
        }

        function limpiar() {
            ['idMantenimiento', 'tipo', 'descripcion', 'costo', 'kilometraje']
                .forEach(id => document.getElementById(id).value = '')
            document.getElementById('idAuto').selectedIndex = 0
            setFechaActual()
            document.getElementById('mensaje').innerHTML = ''
        }

        function getAutoSeleccionado() {
            const select = document.getElementById('idAuto')
            const option = select.options[select.selectedIndex]
            return option ? option.textContent : ''
        }

        function getTextoAuto(response) {
            const data = response?.data || {}
            const id = data.idAutomovilGasolina || document.getElementById('idAuto').value
            const marca = data.marcaAutomovilGasolina || ''
            const modelo = data.modeloAutomovilGasolina || ''

            if (id || marca || modelo) {
                const partes = []
                if (id) partes.push(`ID: ${id}`)
                if (marca) partes.push(`Marca: ${marca}`)
                if (modelo) partes.push(`Modelo: ${modelo}`)
                return partes.join(' | ')
            }

            return getAutoSeleccionado()
        }

        function mostrarMensaje(texto, tipo) {
            document.getElementById('mensaje').innerHTML = `<div class="mensaje ${tipo}">${texto}</div>`
        }

        async function guardar() {
            try {
                const idAuto = document.getElementById('idAuto').value
                if (!idAuto) {
                    mostrarMensaje('Seleccione un automóvil para el mantenimiento.', 'error')
                    return
                }

                const fecha = document.getElementById('fechaMantenimiento').value
                const mantenimiento = {
                    idMantenimiento: document.getElementById('idMantenimiento').value.trim(),
                    tipo: document.getElementById('tipo').value.trim(),
                    descripcion: document.getElementById('descripcion').value.trim(),
                    costo: parseFloat(document.getElementById('costo').value),
                    fechaMantenimiento: fecha ? `${fecha}:00` : '',
                    kilometraje: parseInt(document.getElementById('kilometraje').value),
                    automovilGasolina: { id: idAuto }
                }

                const response = await axios.post(`${BASE_URL}/mantenimientos/`, mantenimiento)
                mostrarMensaje(`Mantenimiento guardado exitosamente. Auto elegido: ${getTextoAuto(response)}`, 'exito')
                limpiar()
            } catch (e) {
                mostrarMensaje('Error al guardar: ' + e.message, 'error')
            }
        }

        setFechaActual()
        cargarAutos()
    </script>
</body>
</html>
