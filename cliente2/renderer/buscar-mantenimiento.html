<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Mantenimiento</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; padding: 30px; }
        h2 { color: #7c3aed; margin-bottom: 20px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; width: 250px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-buscar { background: #7c3aed; color: white; }
        .btn-volver { background: #1e1e1e; color: white; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th { background: #7c3aed; color: white; padding: 10px; text-align: left; font-size: 13px; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        .mensaje { margin-top: 15px; padding: 10px; border-radius: 4px; font-size: 13px; background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>🔍 Buscar Mantenimiento</h2>
    <div class="search-bar">
        <input id="txtId" type="text" placeholder="Ingrese el ID de mantenimiento">
        <button class="btn btn-buscar" onclick="buscar()">Buscar</button>
        <button class="btn btn-volver" onclick="location.href='index.html'">← Volver</button>
    </div>
    <div id="resultado"></div>

    <script>
        const axios = require('axios')
        const BASE_URL = 'http://localhost:8080'

        function formatearFecha(fecha) {
            if (!fecha) return 'N/A'
            return fecha.split('T')[0]
        }

        async function buscar() {
            const id = document.getElementById('txtId').value.trim()
            if (!id) { alert('Ingrese un ID.'); return }

            try {
                const res = await axios.get(`${BASE_URL}/mantenimientos/${id}`)
                const m = res.data
                const auto = m.automovilGasolina || {}
                document.getElementById('resultado').innerHTML = `
                    <table>
                        <tr><th>ID</th><th>Tipo</th><th>Descripción</th><th>Costo</th><th>Fecha</th><th>Kilometraje</th><th>Automóvil</th><th>Marca</th></tr>
                        <tr>
                            <td>${m.idMantenimiento}</td>
                            <td>${m.tipo}</td>
                            <td>${m.descripcion}</td>
                            <td>$${Number(m.costo || 0).toLocaleString()}</td>
                            <td>${formatearFecha(m.fechaMantenimiento)}</td>
                            <td>${m.kilometraje}</td>
                            <td>${auto.id || 'N/A'}</td>
                            <td>${auto.marca || 'N/A'}</td>
                        </tr>
                    </table>`
            } catch (e) {
                document.getElementById('resultado').innerHTML = `<div class="mensaje">No se encontró ningún mantenimiento con ID: ${id}</div>`
            }
        }
    </script>
</body>
</html>
